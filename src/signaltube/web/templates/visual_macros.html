{% macro icon(name) %}<svg viewBox="0 0 24 24" aria-hidden="true" class="icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">{% if name=='play' %}<path d="m9 5 11 7-11 7z"/>{% elif name=='queue' %}<path d="M4 5h16M4 12h11M4 19h8m5-3 4 3-4 3"/>{% elif name=='save' %}<path d="M6 3h12v18l-6-4-6 4z"/>{% elif name=='check' %}<path d="m5 12 4 4L19 6"/>{% else %}<path d="m6 6 12 12M6 18 18 6"/>{% endif %}</svg>{% endmacro %}
{% macro art(v,large=false) %}<div class="art art-{{v.kind}} {% if large %}art-large{% endif %}" aria-hidden="true"><div class="art-grid"></div><span class="art-label">{{v.category|upper}} / LOCAL LIBRARY</span><svg viewBox="0 0 600 330" fill="none" class="illustration">
{% if v.kind=='flight' %}<circle cx="397" cy="140" r="95" stroke="currentColor" opacity=".2"/><circle cx="397" cy="140" r="66" stroke="currentColor" opacity=".25"/><path d="M-20 275 600 140M-20 299 600 164M-20 323 600 188" stroke="currentColor" opacity=".25"/><path d="m130 184 141-39 63-94 19 1-31 85 107-20 56 18-62 14-110 8-54 75-18 1 25-72-111 35z" stroke="currentColor" stroke-width="2.5" fill="currentColor" fill-opacity=".13"/><path d="m116 223 84-19m-52 40 57-14m-8-125 25-6" stroke="currentColor" stroke-width="2"/>
{% elif v.kind=='terminal' %}<rect x="105" y="65" width="390" height="210" rx="14" stroke="currentColor" stroke-width="2"/><path d="M105 102h390m-354 41 19 14-19 14m37 0h72m-109 30h110m-110 22h197" stroke="currentColor" stroke-width="3"/><circle cx="126" cy="84" r="3" fill="currentColor"/><circle cx="139" cy="84" r="3" fill="currentColor"/><circle cx="152" cy="84" r="3" fill="currentColor"/><path d="M365 146h80v80h-80z" stroke="currentColor" opacity=".3"/>
{% elif v.kind=='nodes' %}<path d="m145 100 145 65-145 65m145-65 160-75m-160 75 160 90m-160-90v115m0-115V45" stroke="currentColor" stroke-width="2" opacity=".5"/>{% for x,y,r in [(145,100,25),(145,230,17),(290,165,45),(450,90,29),(450,255,22),(290,45,12),(290,280,13)] %}<circle cx="{{x}}" cy="{{y}}" r="{{r}}" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity=".1"/>{% endfor %}
{% elif v.kind=='coast' %}<circle cx="407" cy="92" r="39" stroke="currentColor" stroke-width="2"/><path d="M0 235q100-75 190-10t190-15 240 10M0 263q100-75 190-10t190-15 240 10M0 291q100-75 190-10t190-15 240 10M195 190h95l-20 22h-58zm47-100v90h-65z" stroke="currentColor" stroke-width="2"/>
{% else %}<path d="m300 45 160 90-160 90-160-90zm-160 90v80l160 90 160-90v-80M300 225v80m-80-125v80m160-80v80M220 90l160 90m-160 0 160-90" stroke="currentColor" stroke-width="2"/><path d="m210 125 40-23 40 23-40 23z" fill="currentColor" fill-opacity=".2"/>{% endif %}</svg><span class="art-caption">CATEGORY ART · NOT A THUMBNAIL</span></div>{% endmacro %}

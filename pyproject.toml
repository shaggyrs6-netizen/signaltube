[project]
name = "signaltube"
version = "0.6.0b1"
description = "Local-first YouTube organiser with explainable picks and a catch-up queue"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/shaggyrs6-netizen/signaltube"
Issues = "https://github.com/shaggyrs6-netizen/signaltube/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.optional-dependencies]
desktop = ["PySide6==6.10.2"]

[project.scripts]
signaltube = "signaltube.cli:main"
signaltube-desktop = "signaltube.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signaltube"]
